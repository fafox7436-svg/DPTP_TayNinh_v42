name: Forecast and multi-file tests

on:
  push:
    branches: [main, 'codex/cai-thien-k-nhieu-thang']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install application dependencies
        run: python -m pip install -r requirements.txt
      - name: Test daily data, target-month suggestions and Streamlit
        run: python -m unittest discover -s tests -p 'test_*.py' -v
